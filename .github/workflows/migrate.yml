name: migrate-prod

# Workflow manual para aplicar una migracion SQL contra prod. Reemplaza
# el dance manual de `aws s3 cp` + `aws ecs run-task` + waiter. Se
# dispara desde Actions UI eligiendo el archivo SQL.

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Path relativo del .sql (ej. db/migrations/20260520_foo.sql)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Aplicar migracion ${{ inputs.migration_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351885857894:role/countrify-github-actions-deploy
          role-session-name: github-actions-migrate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar que el archivo existe
        run: |
          set -euo pipefail
          if [ ! -f "${{ inputs.migration_file }}" ]; then
            echo "::error::No existe el archivo: ${{ inputs.migration_file }}"
            exit 1
          fi
          echo "Archivo encontrado: ${{ inputs.migration_file }}"
          head -5 "${{ inputs.migration_file }}"

      - name: Upload SQL a S3
        run: |
          aws s3 cp "${{ inputs.migration_file }}" \
            s3://citify-prod-assets/_tmp/migration.sql \
            --region "$AWS_REGION"

      - name: Generar override de ECS run-task
        run: |
          cat > /tmp/migrate-override.json <<'EOF'
          {
            "containerOverrides": [
              {
                "name": "countrify-web",
                "command": [
                  "node",
                  "-e",
                  "(async()=>{const{S3Client,GetObjectCommand}=require('@aws-sdk/client-s3');const{Pool}=require('pg');const s3=new S3Client({region:'us-east-1'});const r=await s3.send(new GetObjectCommand({Bucket:'citify-prod-assets',Key:'_tmp/migration.sql'}));const chunks=[];for await(const c of r.Body)chunks.push(c);const sql=Buffer.concat(chunks).toString('utf8');const pool=new Pool({host:process.env.DB_HOST,port:5432,database:process.env.DB_NAME,user:process.env.DB_USER,password:process.env.DB_PASSWORD,ssl:{rejectUnauthorized:false}});await pool.query(sql);console.log('migration applied');await pool.end()})().catch(e=>{console.error(e);process.exit(1)})"
                ]
              }
            ]
          }
          EOF

      - name: Disparar ECS run-task
        id: run-task
        run: |
          set -euo pipefail
          # Buscar la task def activa mas reciente (no hardcodear a una rev).
          LATEST_TD=$(aws ecs describe-services \
            --cluster citify-prod-cluster \
            --services countrify-prod-service \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' --output text)
          echo "Task def: $LATEST_TD"

          TASK_ARN=$(aws ecs run-task \
            --cluster citify-prod-cluster \
            --task-definition "$LATEST_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-08be2fd4a6a2ac3d2,subnet-06b65507a4711bfc5,subnet-0126fd3fb0efdd889],securityGroups=[sg-0387fd2e1b5bfccd7],assignPublicIp=ENABLED}" \
            --overrides file:///tmp/migrate-override.json \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' --output text)

          TASK_ID="${TASK_ARN##*/}"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "Task ID: $TASK_ID"

      - name: Esperar y verificar exit code
        run: |
          set -euo pipefail
          TASK_ID="${{ steps.run-task.outputs.task_id }}"
          aws ecs wait tasks-stopped \
            --cluster citify-prod-cluster \
            --tasks "$TASK_ID" \
            --region "$AWS_REGION"
          EXIT=$(aws ecs describe-tasks \
            --cluster citify-prod-cluster \
            --tasks "$TASK_ID" \
            --region "$AWS_REGION" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Exit code: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "::error::Migration task failed con exit $EXIT"
            aws logs filter-log-events \
              --log-group-name /ecs/countrify-prod-web \
              --start-time $(( ($(date +%s) - 300) * 1000 )) \
              --filter-pattern "error" \
              --region "$AWS_REGION" \
              --output text || true
            exit 1
          fi
          echo "## Migración aplicada" >> $GITHUB_STEP_SUMMARY
          echo "- Archivo: \`${{ inputs.migration_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Task ID: \`$TASK_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
